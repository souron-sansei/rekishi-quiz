<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>歴史ならべかえクイズ</title>
<style>
  :root{
    --ai:#1B3A5C;        /* 藍 */
    --ai-d:#102640;
    --shu:#C0392B;       /* 朱 */
    --kin:#B08843;       /* 金茶 */
    --midori:#2F7A5B;    /* 正解の緑 */
    --usu:#E7EEF5;       /* 薄藍 */
    --kami:#FDFCF9;      /* 紙 */
    --sumi:#1A1A1A;
    --gray:#6B7785;
    --line:#D8DFE7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--kami);color:var(--sumi);
    font-family:"Hiragino Sans","ヒラギノ角ゴシック","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    font-size:18px;line-height:1.7;
    padding:0 0 28px;
    overflow-x:hidden;
    -webkit-user-select:none;user-select:none;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;width:100%;}
  @supports (padding:max(0px)){
    body{padding-bottom:max(28px, env(safe-area-inset-bottom));}
    header{padding-top:max(14px, env(safe-area-inset-top));}
  }
  .mincho{font-family:"Hiragino Mincho ProN","ヒラギノ明朝 ProN",serif;}

  /* ---- ヘッダー ---- */
  header{
    background:var(--ai);color:#fff;padding:14px 0 12px;
    position:sticky;top:0;z-index:20;
  }
  .hd{display:flex;align-items:center;gap:12px;}
  .hd h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.04em;flex:1;}
  .back{
    background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;
    font-size:16px;padding:8px 14px;font-family:inherit;
  }
  .prog{font-size:15px;color:#C9DCEE;white-space:nowrap;}

  /* ---- ホーム ---- */
  .lead{
    font-size:16px;color:var(--gray);margin:18px 0 6px;line-height:1.6;
  }
  .setlist{margin:14px 0 0;}
  .card{
    display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
    border-left:5px solid var(--ai);border-radius:12px;padding:14px 16px;margin-bottom:10px;
    font-family:inherit;font-size:18px;color:var(--sumi);
    box-shadow:0 1px 0 rgba(27,58,92,.06);
  }
  .card:active{background:var(--usu);}
  .card .no{font-size:14px;color:var(--kin);font-weight:700;letter-spacing:.08em;}
  .card .tt{font-size:20px;font-weight:600;margin-top:2px;}
  .card .sub{font-size:15px;color:var(--gray);margin-top:3px;line-height:1.5;}
  .stars{font-size:17px;color:var(--kin);letter-spacing:2px;margin-top:6px;}
  .stars .off{color:#D9D9D9;}
  .card.versus{border-left-color:var(--shu);background:#FFF8F5;}
  .card.versus .no{color:var(--shu);}

  /* ---- セット画面 ---- */
  .settitle{font-size:24px;font-weight:700;margin:18px 0 4px;}
  .setlead{font-size:16px;color:var(--gray);margin:0 0 16px;line-height:1.6;}
  .mode{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;
    font-family:inherit;font-size:18px;color:var(--sumi);
  }
  .mode:active{background:var(--usu);}
  .mode .num{
    width:40px;height:40px;flex:none;border-radius:50%;background:var(--ai);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
  }
  .mode .mt{font-size:19px;font-weight:600;}
  .mode .ms{font-size:14px;color:var(--gray);line-height:1.5;}
  .mode .sc{margin-left:auto;font-size:14px;color:var(--kin);white-space:nowrap;font-weight:700;}

  /* ---- 共通の問題まわり ---- */
  .qbar{display:flex;justify-content:space-between;font-size:15px;color:var(--gray);margin:16px 0 6px;}
  .qtext{font-size:21px;font-weight:600;line-height:1.6;margin:6px 0 16px;}
  .choice{
    display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
    border-radius:12px;padding:15px 16px;margin-bottom:10px;min-height:58px;
    font-family:inherit;font-size:19px;line-height:1.5;color:var(--sumi);
  }
  .choice:active{background:var(--usu);}
  .choice.ok{border-color:var(--midori);background:#EDF7F2;}
  .choice.ng{border-color:var(--shu);background:#FDEFED;}
  .choice.dim{opacity:.45;}
  .btn{
    display:block;width:100%;background:var(--ai);color:#fff;border:0;border-radius:12px;
    padding:16px;font-size:19px;font-weight:600;font-family:inherit;margin-top:14px;
  }
  .btn:active{background:var(--ai-d);}
  .btn.sub{background:#fff;color:var(--ai);border:2px solid var(--ai);}
  .fb{
    border-radius:12px;padding:14px 16px;margin-top:14px;font-size:17px;line-height:1.65;
  }
  .fb.ok{background:#EDF7F2;border:1px solid #BEDFCE;}
  .fb.ng{background:#FDEFED;border:1px solid #F0C7C1;}
  .fb b{font-size:18px;}
  .goro{color:var(--ai);font-weight:600;}

  /* ---- ならべかえ ---- */
  .tl{margin:10px 0 4px;padding-left:4px;}
  .tl .row{display:flex;gap:12px;align-items:stretch;}
  .tl .rail{width:22px;flex:none;position:relative;}
  .tl .rail:before{
    content:"";position:absolute;left:9px;top:0;bottom:0;width:3px;background:var(--usu);
  }
  .tl .row:first-child .rail:before{top:14px;}
  .tl .row:last-child .rail:before{bottom:auto;height:14px;}
  .tl .dot{
    position:absolute;left:3px;top:9px;width:15px;height:15px;border-radius:50%;
    background:var(--ai);border:3px solid var(--kami);
  }
  .tl .item{
    flex:1;padding:6px 0 12px;font-size:18px;line-height:1.45;
  }
  .tl .yr{font-size:15px;color:var(--kin);font-weight:700;margin-right:8px;}
  .tl .blank{color:var(--gray);}
  .chips{margin-top:6px;}
  .chip{
    display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
    border-radius:12px;padding:14px 16px;margin-bottom:9px;min-height:56px;
    font-family:inherit;font-size:19px;line-height:1.4;color:var(--sumi);
  }
  .chip:active{background:var(--usu);}
  .chip.shake{animation:sh .32s;border-color:var(--shu);background:#FDEFED;}
  @keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* ---- どっちが先？ ---- */
  .vs{text-align:center;font-size:17px;color:var(--gray);margin:8px 0;}
  .vsbtn{
    display:block;width:100%;background:#fff;border:2px solid var(--ai);border-radius:14px;
    padding:22px 16px;margin-bottom:12px;font-family:inherit;font-size:20px;font-weight:600;
    color:var(--ai-d);line-height:1.45;min-height:88px;
  }
  .vsbtn:active{background:var(--usu);}
  .vsbtn.ok{background:#EDF7F2;border-color:var(--midori);color:var(--midori);}
  .vsbtn.ng{background:#FDEFED;border-color:var(--shu);color:var(--shu);}
  .timer{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:17px;color:var(--ai);font-weight:700;margin:14px 0 2px;
  }
  .bar{height:8px;background:var(--usu);border-radius:4px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--shu);transition:width .25s linear;}

  /* ---- 結果 ---- */
  .result{text-align:center;padding:26px 0 10px;}
  .result .big{font-size:56px;font-weight:700;color:var(--ai);line-height:1.1;}
  .result .unit{font-size:22px;color:var(--gray);margin-left:4px;}
  .result .msg{font-size:19px;margin-top:10px;line-height:1.6;}
  .miss{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:16px;}
  .miss h3{font-size:16px;margin:0 0 8px;color:var(--shu);}
  .miss li{font-size:17px;line-height:1.6;margin-bottom:6px;}
  .miss ul{margin:0;padding-left:20px;}
  footer{text-align:center;color:var(--gray);font-size:13px;padding:26px 0 0;}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <button class="back" id="back" style="display:none">もどる</button>
    <h1 id="title">歴史ならべかえクイズ</h1>
    <span class="prog" id="prog"></span>
  </div>
</header>
<div class="wrap" id="app"></div>
<footer id="foot"></footer>

/* ===================== 保存 ===================== */
const KEY="rekishi-quiz-v1";
let save={};
try{save=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){save={};}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
function best(k,v){if(!save[k]||v>save[k]){save[k]=v;store();return true;}return false;}

/* ===================== 共通 ===================== */
const app=document.getElementById("app");
const titleEl=document.getElementById("title");
const backEl=document.getElementById("back");
const progEl=document.getElementById("prog");
const footEl=document.getElementById("foot");
let backTo=null;
backEl.onclick=()=>{if(backTo)backTo();};
function head(t,b,p){titleEl.textContent=t;backTo=b;backEl.style.display=b?"":"none";progEl.textContent=p||"";}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}
function starHTML(s){
  let h="";for(let i=0;i<3;i++){const m=["order","word","year"][i];
    h+= save[s.id+"-"+m]===100 ? "★" : '<span class="off">★</span>';}
  return h;
}

/* ===================== 1. ならべかえ ===================== */
function orderGame(s){
  const n=s.flow.length;
  let placed=0,miss=0,missList=[];
  let pool=shuffle(s.flow.map(function(f,i){return{e:f.e,y:f.y,g:f.g,w:f.w,i:i};}));
  head("ならべかえ",()=>setMenu(s),"");
  render();
  function render(){
    let tl="";
    s.flow.forEach((f,i)=>{
      const open=i<placed;
      tl+=`<div class="row"><div class="rail"><i class="dot" style="${open?"":"background:#C9D4E0"}"></i></div>
        <div class="item">${open?`<span class="yr">${f.y}</span>${esc(f.e)}`:`<span class="blank">${i+1}番目は？</span>`}</div></div>`;
    });
    let chips=pool.map(p=>`<button class="chip" data-i="${p.i}">${esc(p.e)}</button>`).join("");
    app.innerHTML=`<div class="qbar"><span>古いものから順にタップ</span><span>${placed} / ${n}</span></div>
      <div class="tl">${tl}</div><div class="chips" id="chips">${chips}</div><div id="fb"></div>`;
    document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>tap(+b.dataset.i,b));
  }
  function tap(i,btn){
    if(i===placed){
      const f=s.flow[placed];
      placed++;
      pool=pool.filter(p=>p.i!==i);
      render();
      const fb=document.getElementById("fb");
      fb.innerHTML=`<div class="fb ok"><b>${f.y}年　${esc(f.e)}</b><br>${esc(f.w)}</div>`;
      if(placed===n){
        const score=Math.max(0,Math.round(100*(n)/(n+miss)));
        setTimeout(()=>result(s,"order",score,missList,"ならべかえ"),700);
      }
    }else{
      miss++;
      const wrong=s.flow[i];
      const right=s.flow[placed];
      if(!missList.includes(right.e))missList.push(right.e);
      btn.classList.add("shake");
      setTimeout(()=>btn.classList.remove("shake"),340);
      document.getElementById("fb").innerHTML=
        `<div class="fb ng"><b>まだ早い：${esc(wrong.e)}（${wrong.y}年）</b><br>
         ヒント　${esc(right.w)}</div>`;
    }
  }
}

/* ===================== 2. 人物・ことば ===================== */
function wordGame(s){
  const qs=shuffle(s.words);let idx=0,ok=0,missList=[];
  head("人物・ことば",()=>setMenu(s),"");
  ask();
  function ask(){
    const q=qs[idx];
    const opts=shuffle(q.c.map((t,i)=>({t,ok:i===q.a})));
    app.innerHTML=`<div class="qbar"><span>第${idx+1}問 / ${qs.length}</span><span>正解 ${ok}</span></div>
      <div class="qtext">${esc(q.q)}</div>
      <div id="ch">${opts.map((o,i)=>`<button class="choice" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>
      <div id="fb"></div>`;
    document.querySelectorAll(".choice").forEach((b,i)=>b.onclick=()=>pick(i,opts,q));
    scrollTo(0,0);
  }
  function pick(i,opts,q){
    const btns=Array.prototype.slice.call(document.querySelectorAll(".choice"));
    btns.forEach((b,j)=>{b.onclick=null;
      if(opts[j].ok)b.classList.add("ok");else if(j===i)b.classList.add("ng");else b.classList.add("dim");});
    const good=opts[i].ok;
    if(good)ok++;else missList.push(q.c[q.a]);
    document.getElementById("fb").innerHTML=
      `<div class="fb ${good?"ok":"ng"}"><b>${good?"せいかい":"おしい"}　答えは ${esc(q.c[q.a])}</b><br>${esc(q.ex)}</div>
       <button class="btn" id="next">${idx+1<qs.length?"次の問題":"結果を見る"}</button>`;
    document.getElementById("next").onclick=()=>{
      idx++;
      if(idx<qs.length)ask();
      else result(s,"word",Math.round(100*ok/qs.length),missList,"人物・ことば");
    };
    try{document.getElementById("fb").scrollIntoView(false);}catch(e){}
  }
}

/* ===================== 3. 年号あて ===================== */
function yearGame(s){
  const years=s.flow.map(f=>f.y).filter((y,i,ar)=>ar.indexOf(y)===i);
  const qs=shuffle(s.flow);let idx=0,ok=0,missList=[];
  head("年号あて",()=>setMenu(s),"");
  ask();
  function ask(){
    const f=qs[idx];
    let cand=shuffle(years.filter(y=>y!==f.y)).slice(0,3);
    let d=2;
    while(cand.length<3){const v=f.y+(cand.length%2?d:-d);if(!cand.includes(v)&&v!==f.y)cand.push(v);d+=3;}
    const opts=shuffle([f.y].concat(cand));
    app.innerHTML=`<div class="qbar"><span>第${idx+1}問 / ${qs.length}</span><span>正解 ${ok}</span></div>
      <div class="qtext">${esc(f.e)}<br><span style="font-size:17px;color:var(--gray);font-weight:400">は何年？</span></div>
      <div class="fb ok" style="margin:0 0 14px"><span class="goro">語呂　${esc(f.g)}</span></div>
      <div id="ch">${opts.map(y=>`<button class="choice" data-y="${y}" style="text-align:center;font-size:22px;font-weight:700">${y}年</button>`).join("")}</div>
      <div id="fb"></div>`;
    document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.y,f));
    scrollTo(0,0);
  }
  function pick(y,f){
    const btns=Array.prototype.slice.call(document.querySelectorAll(".choice"));
    btns.forEach(b=>{b.onclick=null;
      const v=+b.dataset.y;
      if(v===f.y)b.classList.add("ok");else if(v===y)b.classList.add("ng");else b.classList.add("dim");});
    const good=y===f.y;
    if(good)ok++;else missList.push(f.e+"＝"+f.y+"年");
    document.getElementById("fb").innerHTML=
      `<div class="fb ${good?"ok":"ng"}"><b>${good?"せいかい":"おしい"}　${f.y}年　${esc(f.e)}</b><br>${esc(f.w)}</div>
       <button class="btn" id="next">${idx+1<qs.length?"次の問題":"結果を見る"}</button>`;
    document.getElementById("next").onclick=()=>{
      idx++;
      if(idx<qs.length)ask();
      else result(s,"year",Math.round(100*ok/qs.length),missList,"年号あて");
    };
    try{document.getElementById("fb").scrollIntoView(false);}catch(e){}
  }
}

/* ===================== 結果 ===================== */
function result(s,mode,score,missList,label){
  const isBest=best(s.id+"-"+mode,score);
  head("けっか",()=>setMenu(s),"");
  let msg;
  if(score===100)msg="全問正解。★を1つ手に入れた。";
  else if(score>=80)msg="あと少しで★。まちがえた所だけもう一度。";
  else msg="まずは下の内容だけ声に出して読もう。";
  let h=`<div class="result"><div class="big">${score}<span class="unit">点</span></div>
    <div class="msg">${esc(label)}　${esc(msg)}</div>
    ${score===100?'<div class="stars" style="font-size:30px">★</div>':""}</div>`;
  if(missList.length){
    h+=`<div class="miss"><h3>ここをもう一度</h3><ul>${missList.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`;
  }
  h+=`<button class="btn" id="again">もう一回</button>
      <button class="btn sub" id="menu">セットの画面へ</button>`;
  app.innerHTML=h;
  document.getElementById("again").onclick=()=>{
    if(mode==="order")orderGame(s);else if(mode==="word")wordGame(s);else yearGame(s);};
  document.getElementById("menu").onclick=()=>setMenu(s);
  scrollTo(0,0);
}

/* ===================== どっちが先？ ===================== */
function versus(){
  const pool=[];
  SETS.forEach(function(s){s.flow.forEach(function(f){pool.push({e:f.e,y:f.y,g:f.g,w:f.w,set:s.tt});});});
  const TIME=60;let left=TIME,ok=0,ng=0,timer=null,locked=false,missList=[];
  head("どっちが先？",stop,"");
  next();
  timer=setInterval(()=>{
    left--;
    const t=document.getElementById("tleft");
    if(t){t.textContent=left+"秒";document.getElementById("tbar").style.width=(100*left/TIME)+"%";}
    if(left<=0)finish();
  },1000);
  function stop(){clearInterval(timer);home();}
  function next(){
    locked=false;
    let a,b;
    do{a=pool[Math.floor(Math.random()*pool.length)];b=pool[Math.floor(Math.random()*pool.length)];}
    while(a.y===b.y);
    const pair=shuffle([a,b]);
    app.innerHTML=`
      <div class="timer"><span id="tleft">${left}秒</span><span>正解 ${ok}問</span></div>
      <div class="bar"><i id="tbar" style="width:${100*left/TIME}%"></i></div>
      <p class="vs">古いのはどっち？</p>
      <button class="vsbtn mincho" data-k="0">${esc(pair[0].e)}</button>
      <p class="vs" style="color:var(--shu);font-weight:700">VS</p>
      <button class="vsbtn mincho" data-k="1">${esc(pair[1].e)}</button>
      <div id="fb"></div>`;
    document.querySelectorAll(".vsbtn").forEach(btn=>btn.onclick=()=>{
      if(locked)return;locked=true;
      const k=+btn.dataset.k,other=pair[1-k],mine=pair[k];
      const good=mine.y<other.y;
      if(good)ok++;else{ng++;missList.push(`${mine.e}（${mine.y}）と ${other.e}（${other.y}）`);}
      document.querySelectorAll(".vsbtn").forEach((b,j)=>{
        b.classList.add(pair[j].y<pair[1-j].y?"ok":"ng");});
      document.getElementById("fb").innerHTML=
        `<div class="fb ${good?"ok":"ng"}"><b>${pair[0].y}年 と ${pair[1].y}年</b><br>${good?"正解！":"ちがう。古いのは "+esc(other.e)+"。"}</div>`;
      setTimeout(()=>{if(left>0)next();},good?500:1400);
    });
  }
  function finish(){
    clearInterval(timer);
    const prev=save["versus"]||0;
    const isBest=best("versus",ok);
    head("けっか",home,"");
    app.innerHTML=`<div class="result"><div class="big">${ok}<span class="unit">問</span></div>
      <div class="msg">60秒で${ok}問正解（まちがい${ng}問）<br>${isBest?"自己ベスト更新！":"さいこう記録は "+prev+"問"}</div></div>
      ${missList.length?`<div class="miss"><h3>まちがえた組み合わせ</h3><ul>${missList.slice(0,8).map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`:""}
      <button class="btn" id="again">もう一回</button>
      <button class="btn sub" id="menu">さいしょの画面へ</button>`;
    document.getElementById("again").onclick=versus;
    document.getElementById("menu").onclick=home;
    scrollTo(0,0);
  }
}

window.onerror=function(m,src,line){
  var a=document.getElementById("app");
  if(a)a.innerHTML='<div class="fb ng" style="margin-top:20px"><b>うまく動きませんでした</b><br>'+
    '下の文をそのまま送ってください。<br><span style="font-size:15px">'+m+' ／ 行'+line+'</span></div>';
  return true;
};
try{home();}catch(e){
  document.getElementById("app").innerHTML='<div class="fb ng" style="margin-top:20px"><b>うまく動きませんでした</b><br>'+
    '<span style="font-size:15px">'+(e&&e.message)+'</span></div>';
}
</script>
