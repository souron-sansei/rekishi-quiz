<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>歴史ならべかえクイズ</title>
<style>
  :root{
    --ai:#1B3A5C; --ai-d:#102640; --shu:#C0392B; --kin:#B08843; --midori:#2F7A5B;
    --usu:#E7EEF5; --kami:#FDFCF9; --sumi:#1A1A1A; --gray:#6B7785; --line:#D8DFE7;
    --ki:#FFF4CC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--kami);color:var(--sumi);
    font-family:"Hiragino Sans","ヒラギノ角ゴシック","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    font-size:18px;line-height:1.7;padding:0 0 28px;overflow-x:hidden;
    -webkit-user-select:none;user-select:none;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;width:100%;}
  .mincho{font-family:"Hiragino Mincho ProN","ヒラギノ明朝 ProN",serif;}
  header{background:var(--ai);color:#fff;padding:14px 0 12px;position:sticky;top:0;z-index:20;}
  @supports (padding:max(0px)){
    body{padding-bottom:max(28px, env(safe-area-inset-bottom));}
    header{padding-top:max(14px, env(safe-area-inset-top));}
  }
  .hd{display:flex;align-items:center;gap:12px;}
  .hd h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.04em;flex:1;}
  .back{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;font-size:16px;padding:8px 14px;font-family:inherit;}

  /* ホーム */
  .tabs{display:flex;gap:8px;margin:16px 0 4px;}
  .tab{flex:1;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 4px;
       font-family:inherit;font-size:16px;font-weight:600;color:var(--gray);}
  .tab.on{background:var(--ai);border-color:var(--ai);color:#fff;}
  .lead{font-size:16px;color:var(--gray);margin:12px 0 4px;line-height:1.6;}
  .total{font-size:16px;color:var(--kin);font-weight:700;margin:4px 0 12px;}
  .card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
    border-left:5px solid var(--ai);border-radius:12px;padding:14px 16px;margin-bottom:10px;
    font-family:inherit;font-size:18px;color:var(--sumi);}
  .card:active{background:var(--usu);}
  .card .no{font-size:14px;color:var(--kin);font-weight:700;letter-spacing:.08em;}
  .card .tt{font-size:20px;font-weight:600;margin-top:2px;}
  .card .sub{font-size:15px;color:var(--gray);margin-top:3px;line-height:1.5;}
  .stars{font-size:17px;color:var(--kin);letter-spacing:2px;margin-top:6px;}
  .stars .off{color:#D9D9D9;}
  .card.versus{border-left-color:var(--shu);background:#FFF8F5;}
  .card.versus .no{color:var(--shu);}

  /* セット画面 */
  .settitle{font-size:24px;font-weight:700;margin:18px 0 4px;}
  .setlead{font-size:16px;color:var(--gray);margin:0 0 16px;line-height:1.6;}
  .mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;
    font-family:inherit;font-size:18px;color:var(--sumi);}
  .mode:active{background:var(--usu);}
  .mode .num{width:40px;height:40px;flex:none;border-radius:50%;background:var(--ai);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;}
  .mode.read .num{background:var(--kin);}
  .mode .mt{font-size:19px;font-weight:600;}
  .mode .ms{font-size:14px;color:var(--gray);line-height:1.5;}
  .mode .sc{margin-left:auto;font-size:14px;color:var(--kin);white-space:nowrap;font-weight:700;}
  .divider{font-size:14px;color:var(--gray);margin:18px 0 8px;letter-spacing:.06em;}

  /* 流れを読む */
  .story{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 16px 6px;margin-top:14px;}
  .story p{font-size:19px;line-height:1.95;margin:0 0 14px;}
  .hk{font-weight:700;color:var(--ai-d);background:linear-gradient(transparent 62%, #DCE8F4 62%);}
  .hy{font-weight:700;color:var(--shu);}
  .mini{margin-top:16px;}
  .mini h3{font-size:16px;color:var(--gray);margin:0 0 6px;font-weight:600;}
  .mini .r{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:17px;line-height:1.45;}
  .mini .r b{color:var(--kin);width:3.4em;flex:none;text-align:right;}

  /* 穴うめ */
  .ctx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:4px 0 14px;
       font-size:19px;line-height:2.05;}
  .bk{display:inline-block;min-width:3.2em;border:2px solid var(--ai);border-radius:7px;
      padding:0 6px;margin:0 2px;line-height:1.55;text-align:center;font-weight:700;color:var(--ai);background:#fff;}
  .bk.bcur{background:var(--ki);border-color:var(--kin);color:var(--sumi);animation:pl 1.2s infinite;}
  @keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(176,136,67,.45)}50%{box-shadow:0 0 0 5px rgba(176,136,67,0)}}
  .bk.bok{border-color:var(--midori);color:var(--midori);background:#EDF7F2;}
  .bk.bng{border-color:var(--shu);color:var(--shu);background:#FDEFED;}
  .homo{display:inline-block;background:var(--shu);color:#fff;font-size:14px;border-radius:5px;padding:1px 8px;margin-bottom:4px;}

  /* 共通 */
  .qbar{display:flex;justify-content:space-between;font-size:15px;color:var(--gray);margin:16px 0 6px;}
  .qtext{font-size:21px;font-weight:600;line-height:1.6;margin:6px 0 16px;}
  .choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
    border-radius:12px;padding:15px 16px;margin-bottom:10px;min-height:58px;
    font-family:inherit;font-size:20px;line-height:1.5;color:var(--sumi);}
  .choice:active{background:var(--usu);}
  .choice.ok{border-color:var(--midori);background:#EDF7F2;}
  .choice.ng{border-color:var(--shu);background:#FDEFED;}
  .choice.dim{opacity:.45;}
  .btn{display:block;width:100%;background:var(--ai);color:#fff;border:0;border-radius:12px;
    padding:16px;font-size:19px;font-weight:600;font-family:inherit;margin-top:14px;}
  .btn:active{background:var(--ai-d);}
  .btn.sub{background:#fff;color:var(--ai);border:2px solid var(--ai);}
  .btn.gold{background:var(--kin);}
  .fb{border-radius:12px;padding:14px 16px;margin-top:14px;font-size:17px;line-height:1.65;}
  .fb.ok{background:#EDF7F2;border:1px solid #BEDFCE;}
  .fb.ng{background:#FDEFED;border:1px solid #F0C7C1;}
  .fb b{font-size:18px;}
  .goro{color:var(--ai);font-weight:600;}

  /* ならべかえ */
  .tl{margin:10px 0 4px;padding-left:4px;}
  .tl .row{display:flex;gap:12px;align-items:stretch;}
  .tl .rail{width:22px;flex:none;position:relative;}
  .tl .rail:before{content:"";position:absolute;left:9px;top:0;bottom:0;width:3px;background:var(--usu);}
  .tl .row:first-child .rail:before{top:14px;}
  .tl .row:last-child .rail:before{bottom:auto;height:14px;}
  .tl .dot{position:absolute;left:3px;top:9px;width:15px;height:15px;border-radius:50%;background:var(--ai);border:3px solid var(--kami);}
  .tl .item{flex:1;padding:6px 0 12px;font-size:18px;line-height:1.45;}
  .tl .yr{font-size:15px;color:var(--kin);font-weight:700;margin-right:8px;}
  .tl .blank{color:var(--gray);}
  .chip{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
    border-radius:12px;padding:14px 16px;margin-bottom:9px;min-height:56px;
    font-family:inherit;font-size:19px;line-height:1.4;color:var(--sumi);}
  .chip:active{background:var(--usu);}
  .chip.shake{animation:sh .32s;border-color:var(--shu);background:#FDEFED;}
  @keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* どっちが先 */
  .vs{text-align:center;font-size:17px;color:var(--gray);margin:8px 0;}
  .vsbtn{display:block;width:100%;background:#fff;border:2px solid var(--ai);border-radius:14px;
    padding:22px 16px;margin-bottom:12px;font-family:inherit;font-size:20px;font-weight:600;
    color:var(--ai-d);line-height:1.45;min-height:88px;}
  .vsbtn:active{background:var(--usu);}
  .vsbtn.ok{background:#EDF7F2;border-color:var(--midori);color:var(--midori);}
  .vsbtn.ng{background:#FDEFED;border-color:var(--shu);color:var(--shu);}
  .timer{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;color:var(--ai);font-weight:700;margin:14px 0 2px;}
  .bar{height:8px;background:var(--usu);border-radius:4px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--shu);transition:width .25s linear;}

  /* 結果 */
  .result{text-align:center;padding:26px 0 10px;}
  .result .big{font-size:56px;font-weight:700;color:var(--ai);line-height:1.1;}
  .result .unit{font-size:22px;color:var(--gray);margin-left:4px;}
  .result .msg{font-size:19px;margin-top:10px;line-height:1.6;}
  .miss{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:16px;}
  .miss h3{font-size:16px;margin:0 0 8px;color:var(--shu);}
  .miss li{font-size:17px;line-height:1.6;margin-bottom:6px;}
  .miss ul{margin:0;padding-left:20px;}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <button class="back" id="back" style="display:none">もどる</button>
    <h1 id="title">歴史ならべかえクイズ</h1>
  </div>
</header>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   データ
   story の [[正解|ワナ|ワナ]] が穴うめの対象。
   ワナの先頭に ~ を付けたものは「読みが同じで字がちがう」ひっかけ。
   数字だけの [[1221]] は年号（選択肢は自動で作る）。
   ========================================================= */
const SETS = [
/* ---------------- 第1部 超頻出 ---------------- */
{id:1,part:1,tt:"鎖国の完成",sub:"人の出入り → 一揆 → 船。この順で世界がせまくなる。",
 story:[
  "幕府は、信者が団結して逆らうことをおそれ、[[1613]]年に全国に[[禁教令|~禁教例|~禁叫令]]を出しました。[[1624]]年には[[スペイン|ポルトガル|オランダ]]船の来航を禁止し、[[1635]]年には日本人の海外渡航・帰国も禁止しました。",
  "[[1637]]年、重い年貢とキリスト教の弾圧に苦しむ人々が、少年[[天草四郎|~天草史郎|~天草四朗]]を中心に[[島原・天草一揆|~島原・天草一騎|大塩平八郎の乱]]を起こしました。",
  "おどろいた幕府は[[1639]]年に[[ポルトガル|スペイン|イギリス]]船の来航を禁止。[[1641]]年、平戸のオランダ商館を長崎の[[出島|浦賀|堺]]に移して、鎖国が完成しました。このときの将軍は[[徳川家光|~徳川家満|~徳川家充]]です。"],
 flow:[
  {e:"全国に禁教令を出す",y:1613,g:"ヒーローいざ、キリスト教は禁止だ",w:"信者が団結して幕府に逆らうのをおそれた"},
  {e:"スペイン船の来航を禁止",y:1624,g:"ヒーロー、西（にし）の国スペインは来航禁止",w:"布教に熱心な国から順に追い出す"},
  {e:"日本人の海外渡航・帰国を禁止",y:1635,g:"一路、参勤ごくろうさん",w:"外国で信者になった人が帰るのを防ぐ"},
  {e:"島原・天草一揆",y:1637,g:"ヒーローみな集まれ、天草四郎",w:"3万人の一揆に幕府は大きな衝撃を受けた"},
  {e:"ポルトガル船の来航を禁止",y:1639,g:"ヒーロー、みくびるな、もう来るな",w:"一揆の2年後。布教する国を完全にしめ出した"},
  {e:"オランダ商館を出島へ",y:1641,g:"ヒーローよい出島に、オランダさん",w:"貿易はオランダと中国だけに＝鎖国の完成"}],
 words:[
  {q:"島原・天草一揆の中心となった少年は？",c:["天草四郎","大塩平八郎","石川五右衛門","坂本龍馬"],ex:"天草四郎（益田時貞）。キリシタンの少年を中心に3万人が立ち上がった。"},
  {q:"鎖国を完成させた3代将軍は？",c:["徳川家光","徳川家康","徳川綱吉","徳川吉宗"],ex:"徳川家光。参勤交代を制度化したのも家光。"},
  {q:"オランダ商館が移された、長崎の扇形の人工島は？",c:["出島","平戸","浦賀","堺"],ex:"出島。もとはポルトガル人を住まわせるために造られた。"},
  {q:"鎖国の後も貿易を許された国の組み合わせは？",c:["オランダと中国","スペインとポルトガル","イギリスとロシア","ポルトガルと中国"],ex:"オランダと中国（清）。長崎だけが窓口だった。"},
  {q:"キリスト教徒を見つけるために人々に踏ませた絵は？",c:["踏絵","浮世絵","曼荼羅","錦絵"],ex:"踏絵。踏ませる行事のほうは「絵踏」という。"},
  {q:"オランダが追い出されなかった理由は？",c:["キリスト教を広めようとしなかったから","幕府にお金を貸していたから","日本語が話せたから","日本と同盟を結んでいたから"],ex:"布教をせず貿易だけを望んだから。理由を書かせる問題でも出る。"}]},

{id:2,part:1,tt:"昭和・戦争への道",sub:"満州 → 政党政治の終わり → 孤立 → 中国 → 世界。",
 story:[
  "[[1929]]年の[[世界恐慌|~世界恐行|~世界協慌]]で不景気になると、軍は満州に活路を求めました。[[1931]]年、関東軍が[[柳条湖|~柳条胡|~竜条湖]]で線路を爆破し、[[満州事変|~満州事返|日中戦争]]が始まります。",
  "[[1932]]年の[[五・一五事件|二・二六事件|生麦事件]]で首相の[[犬養毅|~犬飼毅|~犬養剛]]が殺され、政党政治が終わりました。国際連盟は[[リットン調査団|岩倉使節団|天正遣欧使節]]の報告をもとに満州国を認めず、日本は[[1933]]年に連盟を脱退します。",
  "[[1936]]年、陸軍の青年将校が[[二・二六事件|五・一五事件|大塩平八郎の乱]]を起こし、軍部の力が強まりました。[[1937]]年、北京郊外の[[盧溝橋|~廬溝橋|~慮溝橋]]での衝突から日中戦争が始まり、翌年には[[国家総動員法|~国家総動因法|治安維持法]]がつくられます。",
  "[[1940]]年に日独伊三国同盟を結び、[[1941]]年、[[東条英機|~東条秀機|~東条英樹]]内閣のもとで真珠湾を攻撃して太平洋戦争が始まりました。[[1945]]年、日本は[[ポツダム宣言|~ポツダム宣原|カイロ宣言]]を受け入れて降伏します。"],
 flow:[
  {e:"満州事変（柳条湖事件）",y:1931,g:"いくさはじまる、満州事変",w:"世界恐慌の行きづまりを満州で解決しようとした"},
  {e:"五・一五事件／満州国の建国",y:1932,g:"いくさにつづく、五・一五事件",w:"犬養毅が殺され、政党政治が終わった"},
  {e:"国際連盟から脱退",y:1933,g:"いくさ、さんざん孤立",w:"リットン調査団の報告で満州国が認められなかった"},
  {e:"二・二六事件",y:1936,g:"いくさ、ろくでもない二・二六",w:"陸軍青年将校のクーデター。軍部の力が決定的に"},
  {e:"日中戦争が始まる",y:1937,g:"いくさ長（なが）びく、日中戦争",w:"盧溝橋事件から全面戦争へ"},
  {e:"国家総動員法",y:1938,g:"いくさ、はげしく総動員",w:"戦争が長引き、物も人もすべて動員することに"},
  {e:"日独伊三国同盟",y:1940,g:"行くよ、まるっとドイツ・イタリアと同盟",w:"アメリカ・イギリスとの対立が決定的になる"},
  {e:"太平洋戦争が始まる",y:1941,g:"行くよ一気に、ハワイの真珠湾",w:"真珠湾を攻撃。開戦時の首相は東条英機"},
  {e:"広島・長崎に原爆／終戦",y:1945,g:"ひどくよごれた焼け野原",w:"東京大空襲→沖縄戦→広島→長崎→ポツダム宣言受諾"}],
 words:[
  {q:"満州事変のきっかけとなった事件は？",c:["柳条湖事件","盧溝橋事件","生麦事件","二・二六事件"],ex:"柳条湖事件。関東軍が自分で線路を爆破した。"},
  {q:"満州を調べるため国際連盟が送った調査団は？",c:["リットン調査団","岩倉使節団","天正遣欧使節","遣唐使"],ex:"リットン調査団。来日は1932年で、脱退（1933）の前の年。"},
  {q:"五・一五事件で暗殺された首相は？",c:["犬養毅","原敬","伊藤博文","東条英機"],ex:"犬養毅。これで政党政治が終わった。"},
  {q:"日中戦争のきっかけとなった事件は？",c:["盧溝橋事件","柳条湖事件","真珠湾攻撃","満州国の建国"],ex:"盧溝橋事件。「廬」と書くまちがいが多い。"},
  {q:"太平洋戦争が始まったときの首相は？",c:["東条英機","犬養毅","加藤高明","原敬"],ex:"東条英機。1941年10月に内閣をつくり、12月に開戦。"},
  {q:"議会にかけずに物資や国民を動員できるようにした法律は？",c:["国家総動員法","治安維持法","普通選挙法","徴兵令"],ex:"国家総動員法（1938年）。日中戦争の長期化が理由。"},
  {q:"1945年8月6日に原子爆弾が落とされた都市は？",c:["広島","長崎","東京","沖縄"],ex:"広島が8月6日、長崎が8月9日。この順もよく出る。"}]},

{id:3,part:1,tt:"鎌倉の4大事件",sub:"将軍が絶える → 朝廷が挑む → 法をつくる → 元が来る。",
 story:[
  "[[1219]]年、3代将軍[[源実朝|~源実友|~源真朝]]が暗殺され、源氏の将軍が絶えました。そのすきに[[後鳥羽上皇|~御鳥羽上皇|~後鳥場上皇]]が兵をあげたのが、[[1221]]年の[[承久の乱|~常久の乱|保元の乱]]です。",
  "幕府軍が勝ち、朝廷を見張るため京都に[[六波羅探題|~六波羅探代|~六波良探題]]を置きました。[[1232]]年、執権[[北条泰時|~北条康時|~北条秦時]]は武士の法律[[御成敗式目|~御成敗織目|~御正敗式目]]を定めます。",
  "元の皇帝[[フビライ|チンギス|ペリー]]の要求を断ったため、[[1274]]年の[[文永の役|~文栄の役|弘安の役]]、[[1281]]年の弘安の役と、元が二度せめてきました。これを[[元寇|~元攻|~元功]]といいます。執権は[[北条時宗|~北条時棟|~北条時旨]]です。",

  "[[603]]年、聖徳太子は能力で役人を選ぶ[[冠位十二階|~官位十二階|~冠位十二回]]を、[[604]]年には役人の心がまえを示す[[十七条の憲法|~十七条の健法|大宝律令]]を定めました。",

/* ===================== 保存 ===================== */
const KEY="rekishi-quiz-v1";
let save={};
try{save=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){save={};}
if(save.versus&&!save["versus-1"])save["versus-1"]=save.versus;
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
function best(k,v){if(save[k]===undefined||v>save[k]){save[k]=v;store();return true;}return false;}
const MODES=["blank","order","word","year"];

/* ===================== 共通 ===================== */
const app=document.getElementById("app");
const titleEl=document.getElementById("title");
const backEl=document.getElementById("back");
let backTo=null;
backEl.onclick=function(){if(backTo)backTo();};
function head(t,b){titleEl.textContent=t;backTo=b;backEl.style.display=b?"":"none";}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});}
function starHTML(s){let h="";MODES.forEach(function(m){h+=save[s.id+"-"+m]===100?"★":'<span class="off">★</span>';});return h;}
function starCount(list){let n=0;list.forEach(function(s){MODES.forEach(function(m){if(save[s.id+"-"+m]===100)n++;});});return n;}
const CIRC="①②③④⑤⑥⑦⑧⑨⑩";

/* 物語の解析 */
function parse(s){
  if(s._p)return s._p;
  const blanks=[];
  const paras=s.story.map(function(p,pi){
    const parts=[];let last=0;const re=/\[\[(.+?)\]\]/g;let m;
    while((m=re.exec(p))!==null){
      if(m.index>last)parts.push({t:p.slice(last,m.index)});
      const arr=m[1].split("|");
      const b={id:blanks.length,pi:pi,ans:arr[0],isYear:/^\d{2,4}$/.test(arr[0]),
        traps:arr.slice(1).map(function(x){return x.charAt(0)==="~"?{t:x.slice(1),homo:true}:{t:x,homo:false};})};
      blanks.push(b);parts.push({b:b.id});last=re.lastIndex;
    }
    if(last<p.length)parts.push({t:p.slice(last)});
    return parts;
  });
  s._p={paras:paras,blanks:blanks};
  return s._p;
}

/* ===================== ホーム ===================== */
let curPart=save.ui||1;
function home(){
  head("歴史ならべかえクイズ",null);
  const list=SETS.filter(function(s){return s.part===curPart;});
  const total=list.length*MODES.length;
  let h='<div class="tabs"><button class="tab'+(curPart===1?" on":"")+'" data-p="1">第1部　超頻出</button>'+
        '<button class="tab'+(curPart===2?" on":"")+'" data-p="2">第2部　重要</button></div>';
  h+='<p class="lead">'+(curPart===1?"入試でくり返し出る7つのテーマ。":"超頻出の次によく出る7つのテーマ。")+
     'まず「流れを読む」で文章を読んでから、問題に進もう。</p>';
  h+='<p class="total">あつめた★　'+starCount(list)+' / '+total+'</p>';
  list.forEach(function(s){
    h+='<button class="card" data-set="'+s.id+'"><span class="no">セット'+s.id+'</span>'+
       '<div class="tt mincho">'+esc(s.tt)+'</div><div class="sub">'+esc(s.sub)+'</div>'+
       '<div class="stars">'+starHTML(s)+'</div></button>';
  });
  h+='<button class="card versus" data-versus="1"><span class="no">スピード勝負</span>'+
     '<div class="tt mincho">どっちが先？</div>'+
     '<div class="sub">60秒で何問正解できるか。第'+curPart+'部の全セットから出題。</div>'+
     '<div class="stars">さいこう記録　'+(save["versus-"+curPart]||0)+'問</div></button>';
  app.innerHTML=h;
  app.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){curPart=+b.dataset.p;save.ui=curPart;store();home();};});
  app.querySelectorAll("[data-set]").forEach(function(b){b.onclick=function(){setMenu(SETS.filter(function(s){return s.id==b.dataset.set;})[0]);};});
  app.querySelector("[data-versus]").onclick=function(){versus(curPart);};
  scrollTo(0,0);
}

/* ===================== セットのメニュー ===================== */
function setMenu(s){
  head("セット"+s.id,home);
  function sc(m){return save[s.id+"-"+m]!==undefined?save[s.id+"-"+m]+"点":"";}
  function item(m,n,t,d){return '<button class="mode" data-m="'+m+'"><span class="num">'+n+'</span>'+
    '<span><span class="mt">'+t+'</span><br><span class="ms">'+d+'</span></span><span class="sc">'+sc(m)+'</span></button>';}
  app.innerHTML='<div class="settitle mincho">'+esc(s.tt)+'</div><p class="setlead">'+esc(s.sub)+'</p>'+
    '<button class="mode read" data-m="read"><span class="num">読</span>'+
    '<span><span class="mt">流れを読む</span><br><span class="ms">まずはここから。文章で流れをつかむ</span></span></button>'+
    '<div class="divider">― 前半：文章の穴うめ ―</div>'+
    item("blank","1","穴うめ","人物・ことば・年号がランダムにかくれる。字のひっかけに注意")+
    '<div class="divider">― 後半：ならべかえと一問一答 ―</div>'+
    item("order","2","ならべかえ","古い順にタップして年表をつくる")+
    item("word","3","人物・ことば","4つから選ぶ。人物で年代を思い出す")+
    item("year","4","年号あて","語呂合わせをヒントに年号を選ぶ");
  app.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){run(s,b.dataset.m);};});
  scrollTo(0,0);
}
function run(s,m){
  if(m==="read")readMode(s);else if(m==="blank")blankGame(s);
  else if(m==="order")orderGame(s);else if(m==="word")wordGame(s);else yearGame(s);
}

/* ===================== 流れを読む ===================== */
function readMode(s){
  head("流れを読む",function(){setMenu(s);});
  const P=parse(s);
  let h='<div class="settitle mincho">'+esc(s.tt)+'</div><div class="story">';
  P.paras.forEach(function(parts){
    h+='<p>'+parts.map(function(x){
      if(x.t!==undefined)return esc(x.t);
      const b=P.blanks[x.b];
      return '<span class="'+(b.isYear?"hy":"hk")+'">'+esc(b.ans)+'</span>';
    }).join("")+'</p>';
  });
  h+='</div><div class="mini"><h3>年表で確認</h3>';
  s.flow.forEach(function(f){h+='<div class="r"><b>'+f.y+'</b><span>'+esc(f.e)+'</span></div>';});
  h+='</div><p class="lead">赤い数字（年号）と、線のついたことばが穴うめに出ます。字の形までよく見ておこう。</p>'+
     '<button class="btn gold" id="go">読んだ → 穴うめに挑戦</button>'+
     '<button class="btn sub" id="menu">セットの画面へ</button>';
  app.innerHTML=h;
  document.getElementById("go").onclick=function(){blankGame(s);};
  document.getElementById("menu").onclick=function(){setMenu(s);};
  scrollTo(0,0);
}

/* ===================== 1. 穴うめ ===================== */
function blankGame(s){
  head("穴うめ",function(){setMenu(s);});
  const P=parse(s);
  const N=Math.min(10,P.blanks.length);
  const pick=shuffle(P.blanks.map(function(b){return b.id;})).slice(0,N).sort(function(a,b){return a-b;});
  const num={};pick.forEach(function(id,i){num[id]=i;});
  const state={};let idx=0,ok=0,missList=[];
  ask();

  function paraHTML(pi,cur){
    return P.paras[pi].map(function(x){
      if(x.t!==undefined)return esc(x.t);
      const b=P.blanks[x.b];
      if(num[b.id]===undefined)return esc(b.ans);
      const st=state[b.id];
      if(st)return '<span class="bk '+(st.ok?"bok":"bng")+'">'+esc(b.ans)+'</span>';
      return '<span class="bk'+(b.id===cur?" bcur":"")+'">'+CIRC.charAt(num[b.id])+'</span>';
    }).join("");
  }
  function choices(b){
    if(!b.isYear){
      return shuffle([{t:b.ans,ok:true}].concat(b.traps.map(function(t){return {t:t.t,ok:false,homo:t.homo};})));
    }
    const a=+b.ans;
    const others=shuffle(P.blanks.filter(function(x){return x.isYear&&+x.ans!==a;}).map(function(x){return +x.ans;}))
      .filter(function(v,i,ar){return ar.indexOf(v)===i;});
    const near=shuffle([a-1,a+1,a-2,a+2,a-3,a+3]).filter(function(v){return v>0&&others.indexOf(v)<0;});
    const c=[near[0]];
    others.forEach(function(v){if(c.length<3&&c.indexOf(v)<0)c.push(v);});
    near.slice(1).forEach(function(v){if(c.length<3&&c.indexOf(v)<0)c.push(v);});
    return shuffle([{t:a+"年",ok:true}].concat(c.map(function(v){return {t:v+"年",ok:false,homo:false};})));
  }
  function ask(){
    const b=P.blanks[pick[idx]];
    const opts=choices(b);
    app.innerHTML='<div class="qbar"><span>'+CIRC.charAt(idx)+'に入るのは？</span><span>'+(idx+1)+' / '+N+'</span></div>'+
      '<div class="ctx" id="ctx">'+paraHTML(b.pi,b.id)+'</div>'+
      '<div id="ch">'+opts.map(function(o,i){return '<button class="choice'+(b.isYear?'" style="text-align:center;font-weight:700':"")+'" data-i="'+i+'">'+esc(o.t)+'</button>';}).join("")+'</div>'+
      '<div id="fb"></div>';
    document.querySelectorAll(".choice").forEach(function(btn,i){btn.onclick=function(){answer(i,opts,b);};});
    scrollTo(0,0);
  }
  function answer(i,opts,b){
    const btns=Array.prototype.slice.call(document.querySelectorAll(".choice"));
    btns.forEach(function(x,j){x.onclick=null;
      if(opts[j].ok)x.classList.add("ok");else if(j===i)x.classList.add("ng");else x.classList.add("dim");});
    const good=opts[i].ok;
    const A=b.isYear?b.ans+"年":b.ans;
    state[b.id]={ok:good};
    if(good)ok++;else missList.push(A+(opts[i].homo?"（✕ "+opts[i].t+"）":""));
    document.getElementById("ctx").innerHTML=paraHTML(b.pi,-1);
    let msg;
    if(good)msg='<div class="fb ok"><b>せいかい</b>　'+esc(A)+'</div>';
    else if(opts[i].homo)msg='<div class="fb ng"><span class="homo">字のひっかけ</span><br><b>読みは同じでも字がちがう！</b><br>正しくは「'+esc(b.ans)+'」。あなたの答え「'+esc(opts[i].t)+'」は別の字。</div>';
    else msg='<div class="fb ng"><b>おしい</b>　答えは「'+esc(A)+'」</div>';
    document.getElementById("fb").innerHTML=msg+'<button class="btn" id="next">'+(idx+1<N?"次へ":"結果を見る")+'</button>';
    document.getElementById("next").onclick=function(){
      idx++;
      if(idx<N)ask();else result(s,"blank",Math.round(100*ok/N),missList,"穴うめ");
    };
    try{document.getElementById("fb").scrollIntoView(false);}catch(e){}
  }
}

/* ===================== 2. ならべかえ ===================== */
function orderGame(s){
  const n=s.flow.length;
  let placed=0,miss=0,missList=[];
  let pool=shuffle(s.flow.map(function(f,i){return {e:f.e,y:f.y,i:i};}));
  head("ならべかえ",function(){setMenu(s);});
  render();
  function render(){
    let tl="";
    s.flow.forEach(function(f,i){
      const open=i<placed;
      tl+='<div class="row"><div class="rail"><i class="dot" style="'+(open?"":"background:#C9D4E0")+'"></i></div>'+
        '<div class="item">'+(open?'<span class="yr">'+f.y+'</span>'+esc(f.e):'<span class="blank">'+(i+1)+'番目は？</span>')+'</div></div>';
    });
    const chips=pool.map(function(p){return '<button class="chip" data-i="'+p.i+'">'+esc(p.e)+'</button>';}).join("");
    app.innerHTML='<div class="qbar"><span>古いものから順にタップ</span><span>'+placed+' / '+n+'</span></div>'+
      '<div class="tl">'+tl+'</div><div>'+chips+'</div><div id="fb"></div>';
    document.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){tap(+b.dataset.i,b);};});
  }
  function tap(i,btn){
    /* 同じ年のできごとは、どちらを先に選んでも正解にする */
    const want=s.flow[placed];
    const pickF=s.flow[i];
    if(i===placed||(pickF.y===want.y&&i>placed)){
      if(i!==placed){const t=s.flow[placed];s.flow[placed]=s.flow[i];s.flow[i]=t;
        pool.forEach(function(p){if(p.i===i)p.i=placed;else if(p.i===placed)p.i=i;});i=placed;}
      const f=s.flow[placed];placed++;
      pool=pool.filter(function(p){return p.i!==i;});
      render();
      document.getElementById("fb").innerHTML='<div class="fb ok"><b>'+f.y+'年　'+esc(f.e)+'</b><br>'+esc(f.w)+'</div>';
      if(placed===n){
        s.flow.sort(function(a,b){return a.y-b.y;});
        setTimeout(function(){result(s,"order",Math.round(100*n/(n+miss)),missList,"ならべかえ");},700);
      }
    }else{
      miss++;
      if(missList.indexOf(want.e)<0)missList.push(want.e);
      btn.classList.add("shake");
      setTimeout(function(){btn.classList.remove("shake");},340);
      document.getElementById("fb").innerHTML='<div class="fb ng"><b>まだ早い：'+esc(pickF.e)+'（'+pickF.y+'年）</b><br>ヒント　'+esc(want.w)+'</div>';
    }
  }
}

/* ===================== 3. 人物・ことば ===================== */
function wordGame(s){
  const qs=shuffle(s.words);let idx=0,ok=0,missList=[];
  head("人物・ことば",function(){setMenu(s);});
  ask();
  function ask(){
    const q=qs[idx];
    const opts=shuffle(q.c.map(function(t,i){return {t:t,ok:i===0};}));
    app.innerHTML='<div class="qbar"><span>第'+(idx+1)+'問 / '+qs.length+'</span><span>正解 '+ok+'</span></div>'+
      '<div class="qtext">'+esc(q.q)+'</div>'+
      '<div>'+opts.map(function(o,i){return '<button class="choice" data-i="'+i+'">'+esc(o.t)+'</button>';}).join("")+'</div><div id="fb"></div>';
    document.querySelectorAll(".choice").forEach(function(b,i){b.onclick=function(){pick(i,opts,q);};});
    scrollTo(0,0);
  }
  function pick(i,opts,q){
    Array.prototype.slice.call(document.querySelectorAll(".choice")).forEach(function(b,j){b.onclick=null;
      if(opts[j].ok)b.classList.add("ok");else if(j===i)b.classList.add("ng");else b.classList.add("dim");});
    const good=opts[i].ok;
    if(good)ok++;else missList.push(q.c[0]);
    document.getElementById("fb").innerHTML='<div class="fb '+(good?"ok":"ng")+'"><b>'+(good?"せいかい":"おしい")+'　答えは '+esc(q.c[0])+'</b><br>'+esc(q.ex)+'</div>'+
      '<button class="btn" id="next">'+(idx+1<qs.length?"次の問題":"結果を見る")+'</button>';
    document.getElementById("next").onclick=function(){
      idx++;if(idx<qs.length)ask();else result(s,"word",Math.round(100*ok/qs.length),missList,"人物・ことば");};
    try{document.getElementById("fb").scrollIntoView(false);}catch(e){}
  }
}

/* ===================== 4. 年号あて ===================== */
function yearGame(s){
  const years=s.flow.map(function(f){return f.y;}).filter(function(y,i,ar){return ar.indexOf(y)===i;});
  const qs=shuffle(s.flow);let idx=0,ok=0,missList=[];
  head("年号あて",function(){setMenu(s);});
  ask();
  function ask(){
    const f=qs[idx];
    const cand=shuffle(years.filter(function(y){return y!==f.y;})).slice(0,3);
    let d=2;
    while(cand.length<3){const v=f.y+(cand.length%2?d:-d);if(cand.indexOf(v)<0&&v!==f.y&&v>0)cand.push(v);d+=3;}
    const opts=shuffle([f.y].concat(cand));
    app.innerHTML='<div class="qbar"><span>第'+(idx+1)+'問 / '+qs.length+'</span><span>正解 '+ok+'</span></div>'+
      '<div class="qtext">'+esc(f.e)+'<br><span style="font-size:17px;color:var(--gray);font-weight:400">は何年？</span></div>'+
      '<div class="fb ok" style="margin:0 0 14px"><span class="goro">語呂　'+esc(f.g)+'</span></div>'+
      '<div>'+opts.map(function(y){return '<button class="choice" data-y="'+y+'" style="text-align:center;font-size:22px;font-weight:700">'+y+'年</button>';}).join("")+'</div><div id="fb"></div>';
    document.querySelectorAll(".choice").forEach(function(b){b.onclick=function(){pick(+b.dataset.y,f);};});
    scrollTo(0,0);
  }
  function pick(y,f){
    Array.prototype.slice.call(document.querySelectorAll(".choice")).forEach(function(b){b.onclick=null;
      const v=+b.dataset.y;
      if(v===f.y)b.classList.add("ok");else if(v===y)b.classList.add("ng");else b.classList.add("dim");});
    const good=y===f.y;
    if(good)ok++;else missList.push(f.e+"＝"+f.y+"年");
    document.getElementById("fb").innerHTML='<div class="fb '+(good?"ok":"ng")+'"><b>'+(good?"せいかい":"おしい")+'　'+f.y+'年　'+esc(f.e)+'</b><br>'+esc(f.w)+'</div>'+
      '<button class="btn" id="next">'+(idx+1<qs.length?"次の問題":"結果を見る")+'</button>';
    document.getElementById("next").onclick=function(){
      idx++;if(idx<qs.length)ask();else result(s,"year",Math.round(100*ok/qs.length),missList,"年号あて");};
    try{document.getElementById("fb").scrollIntoView(false);}catch(e){}
  }
}

/* ===================== 結果 ===================== */
function result(s,mode,score,missList,label){
  best(s.id+"-"+mode,score);
  head("けっか",function(){setMenu(s);});
  let msg;
  if(score===100)msg="全問正解。★を1つ手に入れた。";
  else if(score>=80)msg="あと少しで★。まちがえた所だけもう一度。";
  else msg="「流れを読む」にもどって、下の内容を声に出して読もう。";
  let h='<div class="result"><div class="big">'+score+'<span class="unit">点</span></div>'+
    '<div class="msg">'+esc(label)+'　'+esc(msg)+'</div>'+(score===100?'<div class="stars" style="font-size:30px">★</div>':"")+'</div>';
  if(missList.length)h+='<div class="miss"><h3>ここをもう一度</h3><ul>'+missList.map(function(m){return '<li>'+esc(m)+'</li>';}).join("")+'</ul></div>';
  h+='<button class="btn" id="again">もう一回</button>';
  const nextMode={blank:"order",order:"word",word:"year"}[mode];
  if(nextMode)h+='<button class="btn gold" id="nextm">次の問題へ進む</button>';
  h+='<button class="btn sub" id="menu">セットの画面へ</button>';
  app.innerHTML=h;
  document.getElementById("again").onclick=function(){run(s,mode);};
  if(nextMode)document.getElementById("nextm").onclick=function(){run(s,nextMode);};
  document.getElementById("menu").onclick=function(){setMenu(s);};
  scrollTo(0,0);
}

/* ===================== どっちが先？ ===================== */
function versus(part){
  const pool=[];
  SETS.forEach(function(s){if(s.part===part)s.flow.forEach(function(f){pool.push({e:f.e,y:f.y});});});
  const TIME=60;let left=TIME,ok=0,ng=0,timer=null,locked=false,missList=[];
  head("どっちが先？",stop);
  next();
  timer=setInterval(function(){
    left--;
    const t=document.getElementById("tleft");
    if(t){t.textContent=left+"秒";document.getElementById("tbar").style.width=(100*left/TIME)+"%";}
    if(left<=0)finish();
  },1000);
  function stop(){clearInterval(timer);home();}
  function next(){
    locked=false;
    let a,b;
    do{a=pool[Math.floor(Math.random()*pool.length)];b=pool[Math.floor(Math.random()*pool.length)];}while(a.y===b.y);
    const pair=shuffle([a,b]);
    app.innerHTML='<div class="timer"><span id="tleft">'+left+'秒</span><span>正解 '+ok+'問</span></div>'+
      '<div class="bar"><i id="tbar" style="width:'+(100*left/TIME)+'%"></i></div>'+
      '<p class="vs">古いのはどっち？</p>'+
      '<button class="vsbtn mincho" data-k="0">'+esc(pair[0].e)+'</button>'+
      '<p class="vs" style="color:var(--shu);font-weight:700">VS</p>'+
      '<button class="vsbtn mincho" data-k="1">'+esc(pair[1].e)+'</button><div id="fb"></div>';
    document.querySelectorAll(".vsbtn").forEach(function(btn){btn.onclick=function(){
      if(locked)return;locked=true;
      const k=+btn.dataset.k,mine=pair[k],other=pair[1-k];
      const good=mine.y<other.y;
      if(good)ok++;else{ng++;missList.push(mine.e+"（"+mine.y+"）と "+other.e+"（"+other.y+"）");}
      document.querySelectorAll(".vsbtn").forEach(function(b,j){b.classList.add(pair[j].y<pair[1-j].y?"ok":"ng");});
      document.getElementById("fb").innerHTML='<div class="fb '+(good?"ok":"ng")+'"><b>'+pair[0].y+'年 と '+pair[1].y+'年</b><br>'+(good?"正解！":"ちがう。古いのは "+esc(other.e)+"。")+'</div>';
      setTimeout(function(){if(left>0)next();},good?500:1400);
    };});
  }
  function finish(){
    clearInterval(timer);
    const prev=save["versus-"+part]||0;
    const isBest=best("versus-"+part,ok);
    head("けっか",home);
    app.innerHTML='<div class="result"><div class="big">'+ok+'<span class="unit">問</span></div>'+
      '<div class="msg">60秒で'+ok+'問正解（まちがい'+ng+'問）<br>'+(isBest&&ok>0?"自己ベスト更新！":"さいこう記録は "+prev+"問")+'</div></div>'+
      (missList.length?'<div class="miss"><h3>まちがえた組み合わせ</h3><ul>'+missList.slice(0,8).map(function(m){return '<li>'+esc(m)+'</li>';}).join("")+'</ul></div>':"")+
      '<button class="btn" id="again">もう一回</button><button class="btn sub" id="menu">さいしょの画面へ</button>';
    document.getElementById("again").onclick=function(){versus(part);};
    document.getElementById("menu").onclick=home;
    scrollTo(0,0);
  }
}

window.onerror=function(m,src,line){
  if(app)app.innerHTML='<div class="fb ng" style="margin-top:20px"><b>うまく動きませんでした</b><br>下の文をそのまま送ってください。<br><span style="font-size:15px">'+m+' ／ 行'+line+'</span></div>';
  return true;
};
try{home();}catch(e){app.innerHTML='<div class="fb ng" style="margin-top:20px"><b>うまく動きませんでした</b><br><span style="font-size:15px">'+(e&&e.message)+'</span></div>';}
</script>
